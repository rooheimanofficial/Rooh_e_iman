<!DOCTYPE html><html lang="ur" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surah - Rooh-E-Iman</title><link rel="stylesheet" href="style.css"><style>.quran-reader{max-width:900px;margin:20px auto;padding:10px 16px}.verse-card{background:#fff;margin:0 0 18px;padding:18px;border-radius:12px;box-shadow:0 2px 8px #00000014}.arabic{font-family:"Noto Naskh Arabic","Traditional Arabic",serif;font-size:31px;line-height:2.25;text-align:right;direction:rtl}.urdu{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;font-size:21px;line-height:2.2;text-align:right;direction:rtl;color:#333;margin-top:12px;border-top:1px solid #eee;padding-top:10px}#status{text-align:center;padding:18px}</style></head><body><header><h1>📖 Holy Quran</h1><h2 id="surahName">Loading...</h2><p id="surahArabic"></p><p id="surahVerses"></p><nav><a href="index.html">🏠 Home</a> <a href="quran.html">📖 Back to Quran</a></nav></header><section class="hero"><h2>📖 Arabic + Urdu</h2><div id="status">Loading complete Surah...</div></section><main id="quran" class="quran-reader"></main><script src="surahs.js"></script><script>const API="https://rooh-e-iman-quran-api.rooheiman-official.workers.dev",id=Number(new URLSearchParams(location.search).get("id"));function clean(x){const d=document.createElement("div");d.innerHTML=x||"";return d.textContent||""}async function load(){const s=surahs.find(x=>x.id===id);if(!s){status.textContent="Surah not found.";return}surahName.textContent=s.name;surahArabic.textContent=s.arabic;surahVerses.textContent=s.verses+" Verses";try{const r=await fetch(API+"/surah/"+id);if(!r.ok)throw Error("API "+r.status);const v=(await r.json()).verses||[];quran.innerHTML="";v.forEach(x=>{const c=document.createElement("article");c.className="verse-card";const a=document.createElement("div");a.className="arabic";a.textContent=(x.text_indopak||"")+" ۝ "+(x.verse_number||"");const t=document.createElement("div");t.className="urdu";const u=(x.translations||[]).find(y=>Number(y.resource_id)===97);t.textContent=u?clean(u.text):"Urdu translation not available.";c.append(a,t);quran.append(c)});status.textContent=v.length+" Ayahs loaded — Complete Arabic + Urdu ✓"}catch(e){status.textContent="Quran loading failed: "+e.message}}load();</script></body></html>
