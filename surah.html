constAPI="https://rooh-e-iman-quran-api.rooheiman-official.workers.dev",id=Number(new URLSearchParams(location.search).get("id"));function clean(x){const d=document.createElement("div");d.innerHTML=x||"";return d.textContent||""}async function load(){const s=surahs.find(x=>x.id===id);if(!s){status.textContent="Surah not found.";return}surahName.textContent=s.name;surahArabic.textContent=s.arabic;surahVerses.textContent=s.verses+" Verses";try{const r=await fetch(API+"/surah/"+id);if(!r.ok)throw Error("API "+r.status);const v=(await r.json()).verses||[];quran.innerHTML="";v.forEach(x=>{const c=document.createElement("article");c.className="verse-card";const a=document.createElement("div");a.className="arabic";a.textContent=(x.text_indopak||"")+" ۝ "+(x.verse_number||"");const t=document.createElement("div");t.className="urdu";const u=(x.translations||[]).find(y=>Number(y.resource_id)===97);t.textContent=u?clean(u.text):"Urdu translation not available.";c.append(a,t);quran.append(c)});status.textContent=v.length+" Ayahs loaded — Complete Arabic + Urdu ✓"}catch(e){status.textContent="Quran loading failed: "+e.message}}load();
