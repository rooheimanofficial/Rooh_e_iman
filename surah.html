<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surah - Rooh-E-Iman</title><link rel="stylesheet" href="style.css"><style>
.quran-reader{max-width:1000px;margin:auto;padding:10px 12px 40px}
.reader-title{text-align:center;margin:14px auto;padding:10px}
.verse-card{background:#fff;margin:0 0 15px;padding:16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.arabic-ayah{font-family:"Noto Naskh Arabic","Traditional Arabic","Jameel Noori Nastaleeq",serif;font-size:31px;line-height:2.25;text-align:right;direction:rtl;color:#111}
.urdu-ayah{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic","Jameel Noori Nastaleeq",serif;font-size:21px;line-height:2.15;text-align:right;direction:rtl;color:#333;margin-top:10px;padding-top:10px;border-top:1px solid #ddd}
.status{text-align:center;padding:10px}
@media(max-width:600px){.arabic-ayah{font-size:28px}.urdu-ayah{font-size:20px}}
</style></head><body><header>
<div class="header-top">
<div class="logo"><img src="IMAGE/Logo.png" alt="Rooh-E-Iman Logo"><div class="logo-text"><h2>Rooh-E-Iman</h2><p>Islamic Knowledge</p></div></div>

</div>

</div>
</header>
<section class="hero"><h2>📖 Holy Quran</h2><h1 id="surahName">Loading...</h1><p id="surahArabic"></p><p id="surahVerses"></p><p>Arabic • Urdu Translation</p></section>
<div class="reader-title"><h2>📖 Arabic + Urdu</h2><p id="status" class="status">Surah load ho rahi hai...</p></div><main id="quran" class="quran-reader"></main>
<script src="surahs.js"></script><script>
const API="https://rooh-e-iman-quran-api.rooheiman-official.workers.dev";const id=Number(new URLSearchParams(location.search).get("id"));
function clean(x){const d=document.createElement("div");d.innerHTML=x||"";return d.textContent||d.innerText||""}
async function load(){const s=surahs.find(x=>Number(x.id)===id);if(!s){status.textContent="Surah nahi mili.";return}surahName.textContent=s.name;surahArabic.textContent=s.arabic;surahVerses.textContent=s.verses+" Verses";try{const r=await fetch(API+"/surah/"+id);if(!r.ok)throw Error("API "+r.status);const d=await r.json();const v=d.verses||[];quran.innerHTML="";v.forEach(x=>{const c=document.createElement("article");c.className="verse-card";const a=document.createElement("div");a.className="arabic-ayah";a.textContent=(x.text_indopak||"")+" ۝ "+(x.verse_number||"");const u=document.createElement("div");u.className="urdu-ayah";const t=(x.translations||[]).find(y=>Number(y.resource_id)===97);u.textContent=t?clean(t.text):"Urdu translation available nahi hai.";c.append(a,u);quran.append(c)});status.textContent=v.length+" Ayahs loaded — Arabic + Urdu ✓"}catch(e){status.textContent="Quran data load nahi ho saka: "+e.message}}load();
</script><script src="script.js"></script></body></html>
