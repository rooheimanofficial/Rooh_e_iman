<!DOCTYPE html><html lang="ur" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paras - Rooh-E-Iman</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="quran.css"><style>.para-grid{max-width:900px;margin:20px auto;padding:15px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.para-card{display:block;background:#fff;border-radius:12px;padding:20px;text-align:center;text-decoration:none;color:inherit;box-shadow:0 2px 8px #00000014}.quran-reader{max-width:900px;margin:20px auto;padding:10px 16px}.verse-card{background:#fff;margin:0 0 18px;padding:18px;border-radius:12px;box-shadow:0 2px 8px #00000014}.arabic{font-family:"Noto Naskh Arabic","Traditional Arabic",serif;font-size:31px;line-height:2.25;text-align:right}.urdu{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;font-size:21px;line-height:2.2;text-align:right;color:#333;margin-top:12px;border-top:1px solid #eee;padding-top:10px}#reader{display:none}#status{text-align:center;padding:18px}@media(max-width:600px){.para-grid{grid-template-columns:1fr}}</style></head><body><header><div class="header-top"><div class="logo"><img src="IMAGE/Logo.png" alt="Rooh-E-Iman Logo"><div class="logo-text"><h2>Rooh-E-Iman</h2><p>Islamic Knowledge</p></div></div><div class="menu-bar"><button id="menuBtn">☰</button></div></div><div id="overlay"></div><div id="sideMenu" class="side-menu"><a href="javascript:void(0)" id="closeBtn">✖</a><a href="index.html">🏠 Home</a><a href="quran.html">📖 Quran</a><a href="#">📜 Hadith</a><a href="#">🤲 Duas</a><a href="#">📚 Articles</a><a href="#">📞 Contact</a></div></header><section class="hero"><h2>📖 Para List</h2><h1>30 Paras of the Holy Quran</h1><p>Select any Para to Read</p></section><section id="paraList" class="para-grid"></section><section id="reader"><div class="hero"><h2 id="readerTitle"></h2><div id="status">Loading...</div></div><main id="quran" class="quran-reader"></main></section><script>const API="https://rooh-e-iman-quran-api.rooheiman-official.workers.dev",id=Number(new URLSearchParams(location.search).get("id"));function clean(x){const d=document.createElement("div");d.innerHTML=x||"";return d.textContent||""}for(let i=1;i<=30;i++){const a=document.createElement("a");a.className="para-card";a.href="paras.html?id="+i;a.innerHTML="<strong>📖 Para "+i+"</strong><br><span>پارہ "+i+"</span>";paraList.append(a)}async function load(){if(!id)return;paraList.style.display="none";reader.style.display="block";readerTitle.textContent="📖 Para "+id;try{const r=await fetch(API+"/juz/"+id);if(!r.ok)throw Error("API "+r.status);const v=(await r.json()).verses||[];quran.innerHTML="";v.forEach(x=>{const c=document.createElement("article");c.className="verse-card";const a=document.createElement("div");a.className="arabic";a.textContent=(x.text_indopak||"")+" ۝ "+(x.verse_key||"");const t=document.createElement("div");t.className="urdu";const u=(x.translations||[]).find(y=>Number(y.resource_id)===97);t.textContent=u?clean(u.text):"Urdu translation not available.";c.append(a,t);quran.append(c)});status.textContent=v.length+" Ayahs loaded — Complete Arabic + Urdu ✓"}catch(e){status.textContent="Quran loading failed: "+e.message}}load();</script><script src="script.js"></script></body></html>
